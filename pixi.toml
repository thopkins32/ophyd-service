[workspace]
authors = ["Dmitri Gavrilov <gavrilov.dvs@gmail.com>"]
channels = ["conda-forge"]
name = "ophyd-as-service"
platforms = ["linux-64"]
version = "0.0.1"

[tasks]
test = { cmd = "pytest", env = { OPHYD_CONTROL_LAYER = "dummy" } }

[dependencies]
python = "*"
pip = "*"

[pypi-dependencies]
ophyd-as-service = { path = ".", editable = true, extras = ["dev", "sim"] }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"


[environments]
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

